name: Weekly Maintenance and Security

on:
  schedule:
    - cron: "40 17 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall api src tests

      - name: Secret scan
        run: |
          set -euo pipefail
          grep -RIn "AKIA\\|BEGIN .*PRIVATE KEY\\|SUPABASE_SERVICE_ROLE\\|STRIPE_SECRET\\|RESEND_API_KEY" . \
            --exclude-dir=.git \
            --exclude-dir=venv \
            --exclude-dir=.venv \
            --exclude=.env \
            --exclude=.env.local \
            && exit 1 || exit 0
